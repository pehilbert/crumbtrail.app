<header class="topbar">
  <div class="topbar__inner">
    <a class="wordmark" routerLink="/recipes">crumbtrail</a>
    <nav class="topbar__nav" aria-label="Main">
      <a
        class="pill"
        routerLink="/recipes"
        routerLinkActive="pill--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >My recipes</a
      >
      <a
        class="pill"
        routerLink="/journal"
        routerLinkActive="pill--active"
        ariaCurrentWhenActive="page"
        >Journal</a
      >
    </nav>
    <div class="topbar__spacer"></div>
    <a class="ct-btn ct-btn--sm" routerLink="/recipes/new">
      <svg
        aria-hidden="true"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
      New recipe
    </a>
    <a
      class="profile-btn"
      routerLink="/profile"
      routerLinkActive="profile-btn--active"
      ariaCurrentWhenActive="page"
      aria-label="Profile"
    >
      <svg
        aria-hidden="true"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" />
      </svg>
    </a>
  </div>
</header>

<main>
  <router-outlet />
</main>

@if (!hideTabBar()) {
  <nav class="ct-tabbar tabbar" aria-label="Main">
    <a
      routerLink="/recipes"
      routerLinkActive
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      aria-label="Recipes"
    >
      <svg
        aria-hidden="true"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z" />
        <path d="M4 19V5" />
        <path d="M9 7h6" />
      </svg>
    </a>
    <a
      routerLink="/recipes/new"
      routerLinkActive
      ariaCurrentWhenActive="page"
      aria-label="New recipe"
    >
      <svg
        aria-hidden="true"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </a>
    <a routerLink="/journal" routerLinkActive ariaCurrentWhenActive="page" aria-label="Journal">
      <svg
        aria-hidden="true"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" />
      </svg>
    </a>
    <a routerLink="/profile" routerLinkActive ariaCurrentWhenActive="page" aria-label="Profile">
      <svg
        aria-hidden="true"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" />
      </svg>
    </a>
  </nav>
}
